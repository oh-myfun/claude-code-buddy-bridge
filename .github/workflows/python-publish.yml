# PyPI 发布工作流
# 使用 Trusted Publishing 机制，无需手动配置 API 密钥
# 参考：https://docs.pypi.org/trusted-publishers/

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Run with debug output'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build distribution
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/project/claude-code-buddy-bridge/

    permissions:
      # 信任发布必需的权限
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name == 'release' || github.event.inputs.debug != 'true'
        with:
          packages-dir: dist/

      - name: Show files to be published
        if: github.event.inputs.debug == 'true'
        run: |
          echo "Files in dist/:"
          ls -la dist/
