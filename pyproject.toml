[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-code-buddy-bridge"
version = "0.1.0"
description = "让设备成为 Claude Code CLI 的物理审批按钮 — 电脑作为 TCP 服务端"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "claude-code-buddy-bridge contributors" }]
requires-python = ">=3.11"
keywords = ["claude-code", "tcp", "hardware", "permission", "hook"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ccbb = "ccbb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccbb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
