<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCBB 审批</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
  body { padding-bottom: 2rem; }
  hgroup { margin-bottom: 0; }
  hgroup p { margin-bottom: 0; }
  .card { margin-top: 0.75rem; }
  .status { text-align: center; padding: 2rem 0; color: var(--pico-muted-color); }
  code.pair-code { font-size: 1.5em; letter-spacing: 0.25em; }
  .tool-tag {
    display: inline-block; padding: 0.1em 0.6em; border-radius: 4px;
    font-size: 0.8em; font-weight: 700; letter-spacing: 0.03em;
    background: var(--pico-primary-background); color: var(--pico-primary-inverse);
  }
  .req-section { margin-top: 0.75rem; }
  .req-label { font-size: 0.75em; color: var(--pico-muted-color); margin-bottom: 0.15em; text-transform: uppercase; letter-spacing: 0.05em; }
  .req-value {
    font-size: 0.88em; word-break: break-all; white-space: pre-wrap;
    background: var(--pico-card-background-color); padding: 0.6em 0.8em;
    border-radius: var(--pico-border-radius); border: 1px solid var(--pico-table-border-color);
  }
  .req-value.cmd { font-family: var(--pico-font-family-monospace); }
  .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .actions button { flex: 1; padding: 0.6em; }
  .suggestion-item {
    padding: 0.5em 0; border-bottom: 1px solid var(--pico-table-border-color);
    font-size: 0.85em;
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-dest { color: var(--pico-muted-color); font-size: 0.85em; }
  details summary { font-size: 0.85em; }
  #req-context { font-size: 0.75em; max-height: 240px; overflow: auto; }
</style>
</head>
<body>
<main class="container" style="max-width:480px">
  <hgroup>
    <h2>CCBB 审批</h2>
    <p id="status-text">正在配对…</p>
  </hgroup>

  <!-- 配对中 -->
  <article id="view-pairing" class="card">
    <div class="status">
      <div>配对码</div>
      <code class="pair-code" id="code-display">------</code>
      <div style="margin-top:1rem">正在连接…</div>
    </div>
  </article>

  <!-- 等待审批 -->
  <article id="view-waiting" class="card" hidden>
    <div class="status">已配对，等待审批请求…</div>
  </article>

  <!-- 审批请求 -->
  <article id="view-request" class="card" hidden>
    <header><span class="tool-tag" id="req-tool"></span></header>
    <div id="req-info"></div>
    <details id="req-details" style="margin-top:0.5rem">
      <summary>查看原始数据</summary>
      <div id="req-context" class="req-value"></div>
    </details>
    <div id="req-suggestions" hidden style="margin-top:0.75rem">
      <div class="req-label">记住规则</div>
      <div id="suggestions-list" class="req-value" style="padding:0.3em 0.8em"></div>
    </div>
    <div class="actions">
      <button class="contrast" onclick="decide('allow')">允许</button>
      <button class="secondary outline" onclick="decide('deny')">拒绝</button>
    </div>
  </article>

  <!-- 已完成 -->
  <article id="view-done" class="card" hidden>
    <div class="status" id="done-text"></div>
  </article>
</main>

<script>
const params = new URLSearchParams(location.search);
const code = params.get('code') || '';
let sessionId = '';
let currentId = '';
let evtSource = null;

const $ = id => document.getElementById(id);

function showView(name) {
  ['pairing','waiting','request','done'].forEach(v => {
    $('view-' + v).hidden = v !== name;
  });
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function infoBlock(label, value, cls) {
  return '<div class="req-section"><div class="req-label">' + esc(label)
    + '</div><div class="req-value' + (cls ? ' ' + cls : '') + '">' + esc(value) + '</div></div>';
}

function buildInfoHtml(msg) {
  const tool = msg.tool_name || '?';
  const input = msg.tool_input;
  const html = [];

  if (typeof input === 'object' && input) {
    if (tool === 'Bash') {
      if (input.command) html.push(infoBlock('命令', input.command, 'cmd'));
      if (input.description) html.push(infoBlock('说明', input.description));
    } else if (tool === 'Write' || tool === 'Edit') {
      if (input.file_path) html.push(infoBlock('文件', input.file_path, 'cmd'));
      const c = input.content || input.new_text || input.old_string;
      if (c) html.push(infoBlock('内容', String(c).substring(0, 300)));
    } else if (tool === 'Agent') {
      if (input.description) html.push(infoBlock('描述', input.description));
      if (input.prompt) html.push(infoBlock('提示', String(input.prompt).substring(0, 300)));
    } else if (tool === 'AskUserQuestion') {
      (input.questions || []).forEach(q => {
        const header = q.header ? '[' + esc(q.header) + '] ' : '';
        html.push(infoBlock(q.multiSelect ? '多选' : '单选', header + q.question));
        const opts = (q.options || []).map((o, i) => {
          const id = 'qopt_' + i;
          const type = q.multiSelect ? 'checkbox' : 'radio';
          let s = '<label style="display:block;padding:0.2em 0"><input type="' + type + '" name="qopt" value="' + esc(o.label) + '" data-qi="0"> ' + esc(o.label);
          if (o.description) s += ' <span style="color:var(--pico-muted-color);font-size:0.9em">— ' + esc(o.description) + '</span>';
          return s + '</label>';
        });
        html.push('<div class="req-section"><div class="req-value">' + opts.join('') + '</div></div>');
      });
    } else {
      for (const k of ['command','file_path','url','path','pattern','query','prompt','description']) {
        if (typeof input[k] === 'string' && input[k]) {
          html.push(infoBlock(k, input[k], k === 'command' || k === 'file_path' ? 'cmd' : ''));
          break;
        }
      }
    }
  }
  return html.join('');
}

function buildSuggestionsHtml(suggestions) {
  if (!suggestions || !suggestions.length) return '';
  let html = '';
  suggestions.forEach((sug, si) => {
    const rules = sug.rules || [];
    const dest = sug.destination || '';
    rules.forEach((rule, ri) => {
      const bl = sug.behavior === 'allow' ? '允许' : sug.behavior === 'deny' ? '拒绝' : sug.behavior;
      const tn = rule.toolName || '*';
      const rc = rule.ruleContent || '';
      const desc = rc ? bl + ' ' + tn + ': ' + rc : bl + ' → ' + tn;
      html += '<div class="suggestion-item"><label><input type="checkbox" data-si="'+si+'" data-ri="'+ri+'"> '
        + esc(desc) + (dest ? ' <span class="suggestion-dest">→ ' + esc(dest) + '</span>' : '')
        + '</label></div>';
    });
    if (sug.type === 'setMode') {
      html += '<div class="suggestion-item"><label><input type="checkbox" data-si="'+si+'" data-ri="0"> '
        + '切换模式: ' + esc(sug.mode || '?') + '</label></div>';
    }
  });
  return html;
}

async function pair() {
  if (!code) { $('status-text').textContent = '缺少配对码'; return; }
  $('code-display').textContent = code;
  try {
    const resp = await fetch('/api/pair', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({code}),
    });
    const data = await resp.json();
    if (!resp.ok) { $('status-text').textContent = data.error || '配对失败'; return; }
    sessionId = data.session_id;
    $('status-text').textContent = '已配对';
    showView('waiting');
    openStream();
  } catch (e) {
    $('status-text').textContent = '连接失败: ' + e.message;
  }
}

function openStream() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource('/api/stream?session_id=' + encodeURIComponent(sessionId));

  evtSource.addEventListener('request', e => {
    const msg = JSON.parse(e.data);
    currentId = msg.tool_use_id;
    window._currentSuggestions = msg.permission_suggestions || [];
    window._currentTool = msg.tool_name || '';
    window._currentQuestions = (msg.tool_input || {}).questions || null;

    $('req-tool').textContent = msg.tool_name || '?';
    $('req-info').innerHTML = buildInfoHtml(msg) || infoBlock('操作', '');
    $('req-context').textContent = JSON.stringify(msg, null, 2);

    if (window._currentSuggestions.length > 0) {
      $('req-suggestions').hidden = false;
      $('suggestions-list').innerHTML = buildSuggestionsHtml(window._currentSuggestions);
    } else {
      $('req-suggestions').hidden = true;
    }

    $('status-text').textContent = '收到审批请求';
    showView('request');
  });

  const labels = {allow: '允许', deny: '拒绝', closed: '已在其他设备完成'};
  evtSource.addEventListener('done', e => {
    const data = JSON.parse(e.data);
    $('done-text').textContent = '审批已完成: ' + (labels[data.decision] || data.decision);
    $('status-text').textContent = '等待下一个请求…';
    showView('done');
    setTimeout(() => showView('waiting'), 2000);
  });

  evtSource.addEventListener('session_end', () => {
    $('done-text').textContent = '会话已结束';
    $('status-text').textContent = '会话已结束';
    showView('done');
    evtSource.close();
  });

  evtSource.onopen = () => {
    $('status-text').textContent = '已配对，等待审批请求…';
    showView('waiting');
  };

  evtSource.onerror = () => {};
}

async function decide(behavior) {
  const body = {behavior};
  const tool = window._currentTool || '';

  // AskUserQuestion: 收集选项构造 updatedInput
  if (tool === 'AskUserQuestion' && window._currentQuestions) {
    const answers = {};
    const questions = window._currentQuestions;
    questions.forEach(q => {
      const checked = document.querySelectorAll('input[name="qopt"]:checked');
      const labels = Array.from(checked).map(c => c.value);
      if (q.multiSelect) {
        answers[q.question] = labels;
      } else if (labels.length > 0) {
        answers[q.question] = labels[0];
      }
    });
    body.updatedInput = {questions, answers};
  } else {
    // 非 AskUserQuestion: 检查记住规则
    const checks = document.querySelectorAll('#suggestions-list input[type=checkbox]:checked');
    if (checks.length > 0 && window._currentSuggestions) {
      const sel = [];
      checks.forEach(cb => {
        const si = parseInt(cb.dataset.si);
        const ri = parseInt(cb.dataset.ri);
        const sug = window._currentSuggestions[si];
        if (!sug) return;
        const rules = sug.rules || [];
        if (sug.type === 'setMode') { sel.push(sug); }
        else if (rules[ri]) {
          sel.push({type: sug.type || 'addRules', rules: [rules[ri]], behavior: sug.behavior, destination: sug.destination});
        }
      });
      if (sel.length > 0) body.updatedPermissions = sel;
    }
  }
  try {
    await fetch('/api/decide?session_id=' + encodeURIComponent(sessionId), {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    $('status-text').textContent = '已发送，等待下一个请求…';
    showView('waiting');
  } catch (e) {
    $('status-text').textContent = '发送失败: ' + e.message;
  }
}

pair();
</script>
</body>
</html>
